services:
  backend:
    build: ./backend
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DECISION_CUTOFF_LOCAL: ${DECISION_CUTOFF_LOCAL:-11:00}
      DECISION_CUTOFF_DAYS_BEFORE: ${DECISION_CUTOFF_DAYS_BEFORE:-1}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
